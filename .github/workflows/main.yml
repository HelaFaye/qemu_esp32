name: Legacy ESP-IDF 4.1 examples

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    # ESP-IDF 4.1 predates current runner Python. Its v4.1.1 guide uses Python 3.8.5;
    # keep this upstream-example smoke test on that compatible interpreter.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install ESP-IDF 4.1
        run: |
          mkdir -p "$HOME/esp"
          git clone --recursive --depth 1 --branch release/v4.1 \
            https://github.com/espressif/esp-idf.git "$HOME/esp/esp-idf"
          cd "$HOME/esp/esp-idf"
          ./install.sh

      - name: Compile example 04
        run: |
          . "$HOME/esp/esp-idf/export.sh"
          export BATCH_BUILD=1
          cd "$GITHUB_WORKSPACE/examples/04_sha"
          idf.py build

      - name: Compile all examples
        run: |
          . "$HOME/esp/esp-idf/export.sh"
          export BATCH_BUILD=1
          export V=0
          cd "$GITHUB_WORKSPACE/examples"
          ./compile_all.sh
