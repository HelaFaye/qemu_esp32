; A minimal ESP-IDF app that starts Wi-Fi and scans: the test case for Wi-Fi start-up
; on the emulated S3 (the PHY's calibrations, the MAC's reset; patch 0015).
[env:target]
platform = platformio/espressif32@6.11.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_upload.flash_size = 4MB
