; A power-failure target: a counter in NVS, committed over and over, so faults/power_demo.py
; can cut the supply or dip it at any moment and check nothing committed is lost.
[env:target]
platform = platformio/espressif32@6.11.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_upload.flash_size = 4MB
