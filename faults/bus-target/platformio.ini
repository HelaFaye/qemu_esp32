; A bus-error target: an MCP23017 written and read back over I2C, errors counted, so
; faults/bus_demo.py can add noise and check the driver reports it and recovers.
[env:target]
platform = platformio/espressif32@6.11.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_upload.flash_size = 4MB
