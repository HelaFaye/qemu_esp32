; A fault-injection target: the same PIN check written plainly and hardened, run over and
; over, so faults/campaign.py can glitch every instruction of each and count the bypasses.
[env:target]
platform = platformio/espressif32@6.11.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_upload.flash_size = 4MB
build_flags = -O2
